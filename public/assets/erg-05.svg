<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#111827" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA820A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F4E8C1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#111827" />
  <circle cx="300" cy="270" r="240" fill="url(#bgGlow)" />

  <!-- Outer Luxury Diamond Frame -->
  <rect x="30" y="30" width="540" height="540" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3" rx="8" />
  <rect x="45" y="45" width="510" height="510" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.15" rx="4" />

  <!-- Central Emblem / Icon Graphic -->
  <g transform="translate(300, 260)" filter="url(#shadow)">
    <!-- Inner Radiant Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7" stroke-dasharray="12 6"/>
    <circle cx="0" cy="0" r="85" fill="rgba(255,255,255,0.03)" stroke="#FEF3C7" stroke-width="1.5"/>

    <!-- Category Specific Emblem Shapes -->
    
      <circle cx="-30" cy="-30" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <path d="M-30,-12 L-30,40" stroke="url(#goldGrad)" stroke-width="3"/>
      <polygon points="-30,40 -20,65 -30,85 -40,65" fill="#FEF3C7"/>
      
      <circle cx="30" cy="-30" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <path d="M30,-12 L30,40" stroke="url(#goldGrad)" stroke-width="3"/>
      <polygon points="30,40 40,65 30,85 20,65" fill="#FEF3C7"/>
    
  </g>

  <!-- Product Label Text -->
  <text x="300" y="475" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="#D4AF37" letter-spacing="3">LOVINA FINE JEWELLERY</text>
  <text x="300" y="505" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#E0E0E0" letter-spacing="1.5">EARRINGS • EDITION NO. 05</text>
  <text x="300" y="530" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#888888">Golden Topaz</text>
</svg>